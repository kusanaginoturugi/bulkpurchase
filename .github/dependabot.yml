version: 2
updates:
- package-ecosystem: npm
  directory: "/worker"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    worker-development:
      dependency-type: development
      update-types:
      - minor
      - patch
    worker-production:
      dependency-type: production
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    actions-minor-patch:
      update-types:
      - minor
      - patch
